# tmux — mouse, sane defaults, gruvbox

# ---------- behaviour ----------
set -g mouse on
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# splits: vertical (side by side) on | and :, horizontal (stacked) on - and "
bind | split-window -h
bind : split-window -h
bind - split-window -v
bind '"' split-window -v

# ":" now splits, so the command prompt moves to ";"
bind ';' command-prompt
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g detach-on-destroy off
set -g set-clipboard on
set -g display-time 2000
setw -g mode-keys vi
set -g @shell_mode "vi"

# ---------- terminal ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-features ",xterm-ghostty:RGB"

# ---------- gruvbox palette ----------
# bg0 #282828  bg1 #3c3836  fg #ebdbb2  gray #928374
# red #fb4934  green #b8bb26  yellow #fabd2f
# blue #83a598  purple #d3869b  aqua #8ec07c  orange #fe8019

# ---------- status bar ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-left "#[bg=#83a598,fg=#282828,bold] #S #[bg=#282828,fg=#83a598,nobold] "
set -g status-right-length 80
set -g status-right "#[fg=#928374]#{?window_zoomed_flag,ZOOM ,}#[fg=#8ec07c,bold] #h #[fg=#928374]%d %b #[fg=#fabd2f]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format " #[fg=#a89984] #I:#W "
setw -g window-status-current-format "#[bg=#3c3836,fg=#fabd2f,bold] #I:#W "

# ---------- panes / messages ----------
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#83a598"
set -g mode-style "bg=#fabd2f,fg=#282828"
set -g clock-mode-colour "#83a598"
setw -g clock-mode-colour "#83a598"

# ---------- copy mode ----------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || true"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || true"
