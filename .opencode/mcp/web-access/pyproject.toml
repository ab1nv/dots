[project]
name = "web-access-mcp"
version = "0.1.0"
description = "Best-of-both web access MCP for OpenCode: Hound (master-fetch) engine plus a pi-web-access style retrieval and source-verification layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.27,<2"]

[project.scripts]
web-access = "web_access.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_access"]
