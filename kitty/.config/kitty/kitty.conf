# BEGIN_GENERAL_CONFIG
hide_window_decorations yes
# END_GENERAL_CONFIG

shell tmux

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 16.0
cursor_shape underline
shell_integration no-cursor
cursor_trail 2
copy_on_select yes

# BEGIN_KITTY_THEME
# Corvine
include current-theme.conf
# END_KITTY_THEME